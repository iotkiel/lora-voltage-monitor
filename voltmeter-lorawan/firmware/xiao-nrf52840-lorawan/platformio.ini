; Variante B: XIAO nRF52840 + Wio-SX1262 + INA226 -> LoRaWAN (TTN)
; Flashen per USB (DFU-Button 2x kurz druecken = Bootloader) oder PlatformIO Upload
[env:xiao_nrf52840]
platform = nordicnrf52
board = xiaoble          ; Seeed XIAO nRF52840 (Adafruit Core)
framework = arduino
monitor_speed = 115200
lib_deps =
  jgromes/RadioLib@^7.1.0
  robtillaart/INA226@^0.6.0
