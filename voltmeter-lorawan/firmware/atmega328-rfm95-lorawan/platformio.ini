; Variante C: BaseNode328 (Arduino Pro Mini 3.3V/8MHz + RFM95W) + INA226
; PlatformIO baut die .ino im Ordner-Root (src_dir = .)
[env:pro8MHzatmega328]
platform = atmelavr
board = pro8MHzatmega328   ; Pro Mini 3.3V/8MHz (5V/16MHz: board aendern!)
framework = arduino
src_dir = .
monitor_speed = 115200
lib_deps =
  mcci-catena/MCCI LoRaWAN LMIC library@^4.1.1
  robtillaart/INA226@^0.6.0
build_flags =
  -D DISABLE_PING          ; Flash sparen (ATmega328: 32K!)
  -D DISABLE_BEACONS
; Arduino IDE: stattdessen in <sketchbook>/libraries/MCCI_LoRaWAN_LMIC_library/
;   project_config/lmic_project_config.h die Defines setzen.
