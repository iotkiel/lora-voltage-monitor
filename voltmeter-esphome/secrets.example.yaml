# Vorlage: als secrets.yaml im ESPHome-Config-Ordner ablegen
wifi_ssid: "MeinWLAN"
wifi_password: "MeinPasswort"
# API-Verschluesselung: in ESPHome Builder beim Geraet "Encryption Key"
# generieren lassen (Base64) und hier eintragen. Pflicht ab v0.7.0.
esp_c3_voltmeter__encryption_key: "BASE64-KEY-HIER"
# OTA-Passwort: pro Geraet zufaellig generieren und hier eintragen.
# Pflicht ab v0.7.1.
esp_c3_voltmeter__ota_password: "ZUFAELLIGES-PASSWORT-HIER"
